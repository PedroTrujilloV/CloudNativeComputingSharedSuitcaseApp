[tool.poetry]
name = "offers-app"
version = "0.1.0"
description = "Manage offers related to an existing post for Shared Suitcase delivery platform"
authors = ["Student 2 <student2@uniandes.edu.co>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = ">=0.141.1,<0.142.0"
sqlalchemy = ">=2.0.52,<3.0.0"
uvicorn = ">=0.52.1,<0.53.0"
psycopg = {version = ">=3.2.3,<4.0.0", extras = ["binary"]}


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
httpx2 = ">=2.10.0,<3.0.0"
pytest = ">=9.1.1,<10.0.0"
pytest-cov = ">=7.1.0,<8.0.0"

[tool.pytest.ini_options]
python_files = "test_*.py"
pythonpath = "src"
testpaths = [
  "tests"
]
env = [
  "APP_NAME = offers_app",
  "LOG_LEVEL = INFO",
  # Unit tests run against in-memory SQLite; the application default is
  # postgresql, and the startup lifespan would otherwise try to reach a server.
  "DB_DRIVER = sqlite",
  "DB_HOST = localhost",
  "DB_PORT = 5432",
  "DB_NAME = offers_db",
  "DB_USER = offers_user",
  "DB_PASSWORD = offers_password"
]
