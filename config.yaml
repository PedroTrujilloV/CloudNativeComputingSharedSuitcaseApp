        image_tag: v0.0.0
        authors:
          - pe.trujillo@uniandes.edu.co
    - scores_app:
        folder: scores_app
        image_name: scores-app
        image_tag: v0.0.0
        authors:
          - pe.trujillo@uniandes.edu.co
