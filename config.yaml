# Nombres de los stacks de terraform que se despliegan y
# destruyen en el orden en que están descritos en esta lista. Por cada
# nombre debe existir tanto terraform/stacks/<nombre>/ como
# terraform/environments/<ambiente>/<nombre>/ (con backend.tfvars y
# terraform.tfvars). Ambas carpetas, terraform/stacks/ y
# terraform/environments/, son obligatorias con esos nombres exactos.
tf_stacks:
  # Debe existir como terraform/stacks/apps/ y terraform/environments/<ambiente>/apps/
  # (con backend.tfvars y terraform.tfvars). Si se añaden más stacks, listarlos
  # aquí en el orden de despliegue (la destrucción se aplica en orden inverso).
  # [storage] S3 bucket for all apps and orchestrators. A bucket must be created manually in AWS before running the pipeline for the first time.
  # - 0_storage
  # [database] Shared PostgreSQL RDS instance + Secrets Manager secret + per-app schema scripts table.
  - 1_database
  # [registry] ECR repos for all apps and orchestrators.
  - 2_registry
  # [dynamodb] Dedicated DynamoDB table for the CreditCard entity
  # (credit_cards_app, Entrega 3 RF-006). Exclusive to that component.
  - 3_dynamodb
  # [eks] Shared EKS cluster + per-app namespace + per-app service account + per-app role binding.
  - eks
  # [4_sns] SNS topics + email subscriptions for RF-006 and RF-007. Reads the
  # EMAIL_TO_NOTIFY secret from the pipeline secret map (never hardcoded).
  - 4_sns
  # [sqs] Card verification queue + dead letter queue (RF-006). It lives in
  # tf_stacks (before k8s) because the credit cards manifest needs the queue
  # URL at envsubst time; the consuming Lambda is provisioned by 6_lambda
  # (post_k8s_stacks).
  - 5_sqs
# Ambiente student1 cuyos backend.tfvars/terraform.tfvars
# se usan como base para el ambiente `tutor`.
default_env: student1
# Carpetas con manifiestos de k8s (*.yml) que aplica el pipeline
# ci_entrega2_deploy.yml (AWS/EKS), en el orden en que deben aplicarse.
#
# ORDEN DE DESPLIEGUE (deployment order):
#   - k8s_entrega2/ (despliegue de Entrega 2, 8 servicios + Ingress):
#     el pipeline ci_entrega2_deploy.yml aplica los archivos *.yml de esta
#     carpeta en orden alfabetico; por eso el nombre de cada archivo
#     codifica su posicion: secrets (00) -> shared db (15) -> apps (20) ->
#     ingress (zz, siempre al final porque enruta a todos los services anteriores).
#     (20) -> ingress (zz, siempre al final porque enruta a todos los
#     services anteriores).
#
# DESPLIEGUE LEGACY (Entrega 1, evaluado en GitHub/Minikube):
#   - k8s/entrega1_k8s/ contiene los manifiestos legacy (*.yaml) de las
#     4 apps originales (users_app, posts_app, offers_app, routes_app, con
#     imagenes de guion bajo) y sus NetworkPolicies. NO va en k8s_manifests:
#     el pipeline ci_entrega1_evaluador_k8s.yml (GitHub) aplica
#     recursivamente `kubectl apply -f k8s` y construye esas imagenes solo
#     para ese evaluador. Por eso k8s/ solo contiene la carpeta
#     entrega1_k8s/ y el despliegue de Entrega 2 vive en su propia carpeta
#     (k8s_entrega2/): los dos despliegues definen recursos con el mismo
#     nombre (users-app, users-app-service, users-db, ...) con imagenes
#     distintas, y no deben aplicarse juntos en el mismo cluster.
k8s_manifests:
  # - k8s
  - k8s_entrega2
  - k8s_entrega3
# Opcional. Misma forma que tf_stacks (nombres de stack, no rutas), pero
# estos se aplican DESPUÉS de que los manifiestos de k8s_manifests ya estén
# desplegados, en vez de antes. Úselo para stacks que necesiten algo que
# solo existe una vez que k8s ya está desplegado (ej. el host del load
# balancer de ingress-nginx). Ver detalle en los recursos de la entrega.
# Mientras no haya stacks post-k8s, la lista debe permanecer ausente o
# vacía: el pipeline valida que cada nombre exista como carpeta en
# terraform/stacks/ y un placeholder de texto haría fallar la corrida.
post_k8s_stacks:
  # [lambda] Card worker Lambda function + least privilege role + SQS event
  # source mapping (RF-006). Post-k8s because its TRUENATIVE_URL is the
  # host of the ingress load balancer, which only exists after the k8s
  # manifests are deployed.
  - 6_lambda

