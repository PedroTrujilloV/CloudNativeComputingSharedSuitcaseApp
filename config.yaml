# construir las apps legacy en Minikube. Los nombres de imagen usan guion
# bajo y coinciden con los manifiestos de k8s/entrega1_k8s/ (despliegue
# legacy). No los confundir con la lista 'apps' de abajo, que usa guiones y
# alimenta el pipeline ci_entrega2_deploy.yml (AWS/ECR + k8s/).
