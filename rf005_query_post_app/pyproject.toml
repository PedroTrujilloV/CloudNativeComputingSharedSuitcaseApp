[tool.poetry]
name = "rf005_query_post_app"
version = "0.0.0"
description = "RF-005 orchestrator: query post (auth + authorization gate)."
authors = [
  "Pedro Trujillo <pe.trujillo@uniandes.edu.co>"
]
license = "MIT"
readme = "README.md"
package-mode = false
packages = [{include = "*", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "~3.11"
fastapi = "~0.115.12"
uvicorn = "~0.27.1"
python-dotenv = "~1.0.1"
pydantic = "~2.6.1"
pydantic-settings = "~2.1.0"
httpx = "~0.28.1"

[tool.poetry.group.dev.dependencies]
black = "~25.1.0"
ruff = "~0.11.12"
bandit = "~1.8.3"
flake8 = "~7.2.0"
isort = "~6.0.1"
pytest = "~8.4.0"
pytest-cov = "~6.1.1"
pytest-mock = "~3.14.1"
pytest-env = "~1.1.5"
httpx = "~0.28.1"
faker = "~37.3.0"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["./tests"]
skips = ["B101"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false

[tool.ruff]
src = ["src"]
fix = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
python_files = "test_*.py"
pythonpath = "src"
testpaths = [
  "tests"
]
env = [
  "APP_NAME = rf005_query_post_app",
  "LOG_LEVEL = INFO",
  "USERS_SERVICE_URL = http://users-app-service:8000",
  "POSTS_SERVICE_URL = http://posts-app-service:8002",
  "ROUTES_SERVICE_URL = http://routes-app-service:8001",
  "OFFERS_SERVICE_URL = http://offers-app-service:8003",
  "SCORES_SERVICE_URL = http://scores-app-service:8004"
]
