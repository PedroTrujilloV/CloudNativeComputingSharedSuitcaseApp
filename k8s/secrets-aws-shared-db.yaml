# ============================================================
# K8s Secrets for AWS Production — Shared RDS (shared_db)
# ============================================================
# In production, all applications connect to a SINGLE shared PostgreSQL
# instance (AWS RDS). Each app isolates its data using:
#   - A dedicated schema within the shared database
#   - A dedicated database role with grants scoped to that schema
#
# These Secrets are populated by the External Secrets Operator (ESO)
# from AWS Secrets Manager at runtime. The AWS Secret path structure
# should follow:
#   aws-secrets-manager/shared-db
#     keys: DB_HOST, DB_PORT, DB_NAME (shared_db), DB_USER, DB_PASSWORD
#
# Each app also gets its own per-app credential in AWS Secrets Manager:
#   aws-secrets-manager/{app}-db
#     keys: SCHEMA_NAME (users, posts, offers, routes, scores)
#            DB_ROLE (users_role, posts_role, etc.)
#            DB_GRANTS (USAGE ON SCHEMA, CREATE privileges, etc.)
#
# The app's Deployment uses a two-step env setup:
#   1. Shared connection (DB_HOST, DB_PORT, DB_NAME) from shared-db secret
#   2. Per-app identity (SCHEMA_NAME, DB_ROLE) from the per-app secret
#
# Local Minikube (placeholder values):
#   These Secrets use placeholder base64 values for development only.
#   In local k8s, each app actually gets its own independent Postgres pod,
#   so the "shared_db" concept does not apply locally. This file documents
#   the production AWS model. See notes in deployment-view.md.
---
# ============================================================
# Shared RDS Connection Details (single secret for all apps)
# All apps read DB_HOST, DB_PORT from this shared secret.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: shared-db-secrets
type: Opaque
data:
  # "shared-db-host.local" is a placeholder — replaced by ESO in production
  # with the actual RDS endpoint from AWS Secrets Manager
  DB_HOST: c2hhcmVkLWRiLWhvc3Q=      # shared-db-host
  DB_PORT: NTQzMg==                            # "5432"
  DB_NAME: c2hhcmVkX2Ri                      # shared_db

---
# Users App per-app credential (schema + role within shared_db)
apiVersion: v1
kind: Secret
metadata:
  name: users-app-db-creds
type: Opaque
data:
  SCHEMA_NAME: dXNlcnM=                # "users" schema
  DB_ROLE: dXNlcnNfcm9sZQ==            # "users_role"
  DB_USER: dXNlcnNfdXNlcg==            # "users_user" (role login)
  DB_PASSWORD: dXNlcnNfcGFzcw==       # password for the role

---
# Posts App per-app credential (schema + role within shared_db)
apiVersion: v1
kind: Secret
metadata:
  name: posts-app-db-creds
type: Opaque
data:
  SCHEMA_NAME: cG9zdHM=                # "posts" schema
  DB_ROLE: cG9zdHNfcm9sZQ==            # "posts_role"
  DB_USER: cG9zdHNfdXNlcg==           # "posts_user" (role login)
  DB_PASSWORD: cG9zdHNfcGFzcw==       # password for the role

---
# Offers App per-app credential (schema + role within shared_db)
apiVersion: v1
kind: Secret
metadata:
  name: offers-app-db-creds
type: Opaque
data:
  SCHEMA_NAME: b2ZmZXJz                # "offers" schema
  DB_ROLE: b2ZmZXJzX3JvbGU=            # "offers_role"
  DB_USER: b2ZmZXJzX3VzZXI=           # "offers_user" (role login)
  DB_PASSWORD: b2ZmZXJzX3Bhc3M=       # password for the role

---
# Routes App per-app credential (schema + role within shared_db)
apiVersion: v1
kind: Secret
metadata:
  name: routes-app-db-creds
type: Opaque
data:
  SCHEMA_NAME: cm91dGVz                # "routes" schema
  DB_ROLE: cm91dGVzX3JvbGU=            # "routes_role"
  DB_USER: cm91dGVzX3VzZXI=           # "routes_user" (role login)
  DB_PASSWORD: cm91dGVzX3Bhc3M=       # password for the role

---
# Scores App per-app credential (schema + role within shared_db)
apiVersion: v1
kind: Secret
metadata:
  name: scores-app-db-creds
type: Opaque
data:
  SCHEMA_NAME: c2NvcmVz                # "scores" schema
  DB_ROLE: c2NvcmVzX3JvbGU=            # "scores_role"
  DB_USER: c2NvcmVzX3VzZXI=           # "scores_user" (role login)
  DB_PASSWORD: c2NvcmVzX3Bhc3M=       # password for the role
