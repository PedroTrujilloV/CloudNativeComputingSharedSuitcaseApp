# Kubernetes deployment for posts_app
# Minikube: app + PostgreSQL (ephemeral emptyDir)
# Namespace: default
# DB credentials: managed via AWS Secrets Manager by External Secrets Operator
# ENVIRONMENT NOTES: Local minikube = own DB pod (k8s/secrets.yaml). AWS = shared RDS (see k8s/secrets-aws-shared-db.yaml).
#
# Usage (from repository root):
#   kubectl apply -f k8s/posts-app.yaml
#   minikube service posts-app-service --url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-app
  labels:
    app: posts-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-app
  template:
    metadata:
      labels:
        app: posts-app
    spec:
      containers:
        - name: posts-app
          image: posts_app:v0.0.0
          ports:
            - containerPort: 8000
          env:
            - name: APP_NAME
              value: "posts_app"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_DRIVER
              value: "postgresql"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: posts-app-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: posts-app-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: posts-app-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: posts-app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: posts-app-secrets
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /posts/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /posts/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: posts-app-service
  labels:
    app: posts-app
spec:
  type: NodePort
  selector:
    app: posts-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30001
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-db
  labels:
    app: posts-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-db
  template:
    metadata:
      labels:
        app: posts-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "posts_db"
            - name: POSTGRES_USER
              value: "posts_user"
            - name: POSTGRES_PASSWORD
              value: "posts_pass"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - posts_user
                - -d
                - posts_db
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - posts_user
                - -d
                - posts_db
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: posts-db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: posts-db-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: posts-db-service
  labels:
    app: posts-db
spec:
  type: ClusterIP
  selector:
    app: posts-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
