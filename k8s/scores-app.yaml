# Kubernetes deployment for scores_app
# Minikube: app + PostgreSQL (ephemeral emptyDir)
# Namespace: default
#
# Usage (from repository root):
#   kubectl apply -f k8s/scores-app.yaml
#   minikube service scores-app-service --url
---
# ============================================================
# scores-app Deployment
# Stateless orchestrator with its own database
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scores-app
  labels:
    app: scores-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scores-app
  template:
    metadata:
      labels:
        app: scores-app
    spec:
      containers:
        - name: scores-app
          image: scores_app:v0.0.0
          ports:
            - containerPort: 8000

          # Environment-based configuration
          env:
            - name: APP_NAME
              value: "scores_app"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_DRIVER
              value: "postgresql"
            - name: DB_HOST
              value: "scores-db-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_PASSWORD

          livenessProbe:
            httpGet:
              path: /scores/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /scores/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

---
# ============================================================
# scores-app Service
# NodePort for external access through Minikube
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: scores-app-service
  labels:
    app: scores-app
spec:
  type: NodePort
  selector:
    app: scores-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30004
      protocol: TCP

---
# ============================================================
# scores-db Deployment (PostgreSQL)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scores-db
  labels:
    app: scores-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scores-db
  template:
    metadata:
      labels:
        app: scores-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_PASSWORD

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: scores-db-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: scores-db-storage
          emptyDir: {}

---
# ============================================================
# scores-db Service
# ClusterIP - internal access only
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: scores-db-service
  labels:
    app: scores-db
spec:
  type: ClusterIP
  selector:
    app: scores-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
