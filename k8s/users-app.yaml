# Kubernetes deployment for users_app
# Minikube: app + PostgreSQL (ephemeral emptyDir)
# Namespace: default
# DB credentials: managed via AWS Secrets Manager by External Secrets Operator
# (see k8s/secrets.yaml for local minikube values;
#  see k8s/secrets-aws-shared-db.yaml for AWS production model below)
#
# ENVIRONMENT NOTES:
#
# Local Minikube (Entrega 1 model):
#   Each app has its own DB pod. Apply k8s/secrets.yaml and all -app.yaml files.
#   DB_HOST points to the local users-db-service ClusterIP.
#
# AWS Production (Entrega 2 model):
#   All apps share a single RDS instance (shared_db). Each app uses its own
#   schema + role within that shared database for data isolation.
#
#   Changes required for AWS deployment:
#     1. kubectl apply -f k8s/secrets-aws-shared-db.yaml    # shared-db-secrets + per-app creds
#     2. In each app Deployment, update DB_HOST/DB_PORT to read from shared-db-secrets
#        and SCHEMA_NAME/DB_ROLE from the per-app credentials (see comment in env block)
#
# Usage (from repository root):
#   kubectl apply -f k8s/users-app.yaml
#   minikube service users-app-service --url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
  labels:
    app: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      containers:
        - name: users-app
          image: users_app:v0.0.0
          ports:
            - containerPort: 8000
          env:
            - name: APP_NAME
              value: "users_app"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_DRIVER
              value: "postgresql"
            # Local minikube: all DB values from users-app-secrets (own DB pod)
            # AWS production: use k8s/secrets-aws-shared-db.yaml model instead
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: users-app-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: users-app-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: users-app-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: users-app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-app-secrets
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /users/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /users/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: users-app-service
  labels:
    app: users-app
spec:
  type: NodePort
  selector:
    app: users-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
  labels:
    app: users-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "users_db"
            - name: POSTGRES_USER
              value: "users_user"
            - name: POSTGRES_PASSWORD
              value: "users_pass"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - users_user
                - -d
                - users_db
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - users_user
                - -d
                - users_db
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: users-db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: users-db-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: users-db-service
  labels:
    app: users-db
spec:
  type: ClusterIP
  selector:
    app: users-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
