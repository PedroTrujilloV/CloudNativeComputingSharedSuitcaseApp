# ============================================================
# K8s Secrets for all apps
# ============================================================
# These Secrets are populated by the External Secrets Operator (ESO)
# from AWS Secrets Manager in production.
#
# Production setup:
#   1. Install External Secrets Operator in your EKS cluster
#      https://external-secrets.io/latest/
#   2. Create SecretStore referencing AWS IAM role
#   3. Create SecretRef resources mapping K8s Secret keys to
#      AWS Secrets Manager key paths
#
# Local Minikube (manual):
#   The base64 values below are placeholders for development.
#   Each app has its own separate Postgres pod — DB credentials per app.
#   Base64 encoding: echo -n "value" | base64
#   Decode: echo "cGxhY2Vob2xkZXI=" | base64 -d
#
# IMPORTANT: For AWS production, all apps share a single RDS instance.
#   See k8s/secrets-aws-shared-db.yaml for the shared-db credential model.
---
# Users App Secret (local: separate DB pod)
apiVersion: v1
kind: Secret
metadata:
  name: users-app-secrets
type: Opaque
data:
  DB_HOST: dXNlcnMtZGItc2VydmljZQ==       # users-db-service
  DB_PORT: NTQzMg==                              # "5432"
  DB_NAME: dXNlcnNfZGI=                       # users_db
  DB_USER: dXNlcnNfdXNlcg==                   # users_user
  DB_PASSWORD: dXNlcnNfcGFzcw==                # users_pass

---
# Posts App Secret (local: separate DB pod)
apiVersion: v1
kind: Secret
metadata:
  name: posts-app-secrets
type: Opaque
data:
  DB_HOST: cG9zdHMtZGItc2VydmljZQ==       # posts-db-service
  DB_PORT: NTQzMg==                              # "5432"
  DB_NAME: cG9zdHNfZGI=                       # posts_db
  DB_USER: cG9zdHNfdXNlcg==                   # posts_user
  DB_PASSWORD: cG9zdHNfcGFzcw==                # posts_pass

---
# Offers App Secret (local: separate DB pod)
apiVersion: v1
kind: Secret
metadata:
  name: offers-app-secrets
type: Opaque
data:
  DB_HOST: b2ZmZXJzLWRiLXNlcnZpY2U=       # offers-db-service
  DB_PORT: NTQzMg==                              # "5432"
  DB_NAME: b2ZmZXJzX2Ri=                      # offers_db
  DB_USER: b2ZmZXJzX3VzZXI=                   # offers_user
  DB_PASSWORD: b2ZmZXJzX3Bhc3M=                # offers_pass

---
# Routes App Secret (local: separate DB pod)
apiVersion: v1
kind: Secret
metadata:
  name: routes-app-secrets
type: Opaque
data:
  DB_HOST: cm91dGVzLWRiLXNlcnZpY2U=       # routes-db-service
  DB_PORT: NTQzMg==                              # "5432"
  DB_NAME: cm91dGVzX2Ri=                       # routes_db
  DB_USER: cm91dGVzX3VzZXI=                   # routes_user
  DB_PASSWORD: cm91dGVzX3Bhc3M=                # routes_pass

---
# Scores App Secret (local: separate DB pod)
apiVersion: v1
kind: Secret
metadata:
  name: scores-app-secrets
type: Opaque
data:
  DB_HOST: c2NvcmVzLWRiLXNlcnZpY2U=       # scores-db-service
  DB_PORT: NTQzMg==                              # "5432"
  DB_NAME: c2NvcmVzX2Ri=                       # scores_db
  DB_USER: c2NvcmVzX3VzZXI=                   # scores_user
  DB_PASSWORD: c2NvcmVzX3Bhc3M=                # scores_pass
