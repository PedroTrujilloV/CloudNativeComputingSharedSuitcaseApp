# Kubernetes deployment for scores_app
# Minikube: app only; shared-db-service provides Postgres (k8s_entrega2/local-only/15-shared-db.yml)
# Namespace: default
#
# ENVIRONMENT NOTES:
#   Local minikube = shared-db-service (own database per app)
#   AWS = shared RDS (see k8s_entrega2/00-aws-secrets-shared-db.yml)
#
# Usage (from repository root):
#   kubectl apply -f k8s_entrega2/24-scores-app.yml
#   minikube service scores-app-service --url
---
# ============================================================
# scores-app Deployment
# Data-owning service with its own database in shared-db
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scores-app
  labels:
    app: scores-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scores-app
  template:
    metadata:
      labels:
        app: scores-app
    spec:
      containers:
        - name: scores-app
          image: ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/scores-app:v0.0.0
          ports:
            - containerPort: 8000

          # Environment-based configuration
          env:
            - name: APP_NAME
              value: "scores_app"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_DRIVER
              value: "postgresql"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scores-app-secrets
                  key: DB_PASSWORD

          livenessProbe:
            httpGet:
              path: /scores/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /scores/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            limits:
              cpu: "150m"
              memory: "150Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

---
# ============================================================
# scores-app Service (ClusterIP — Ingress-only, no external access)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: scores-app-service
  labels:
    app: scores-app
spec:
  type: ClusterIP
  selector:
    app: scores-app
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
