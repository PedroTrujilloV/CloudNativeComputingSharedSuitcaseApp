# Kubernetes deployment for routes_app
# Minikube: app only; shared-db-service provides Postgres (k8s_entrega2/local-only/15-shared-db.yml)
# Namespace: default
# DB credentials: managed via AWS Secrets Manager by External Secrets Operator
#
# ENVIRONMENT NOTES:
#   Local minikube = shared-db-service (own database per app)
#   AWS = shared RDS (see k8s_entrega2/00-aws-secrets-shared-db.yml)
#
# Usage:
#   kubectl apply -f k8s_entrega2/23-routes-app.yml
#   minikube service routes-app-service --url
---

# ============================================================
# routes-app Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      containers:
        - name: routes-app
          image: ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/routes-app:v0.0.0
          ports:
            - containerPort: 8000

          # Environment-based database configuration
          env:
            - name: APP_NAME
              value: "routes_app"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_DRIVER
              value: "postgresql"
            # Local minikube: all DB values from routes-app-secrets (shared-db-service)
            # AWS production: use k8s_entrega2/00-aws-secrets-shared-db.yml model instead
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: routes-app-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: routes-app-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: routes-app-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: routes-app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: routes-app-secrets
                  key: DB_PASSWORD

          livenessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            limits:
              cpu: "150m"
              memory: "150Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

---
# ============================================================
# routes-app Service (ClusterIP — Ingress-only, no external access)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
  labels:
    app: routes-app
spec:
  type: ClusterIP
  selector:
    app: routes-app
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
