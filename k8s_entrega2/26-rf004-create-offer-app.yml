# Kubernetes deployment for rf004_create_offer_app
# Stateless orchestrator: no database, only service calls
# Namespace: default
#
# Usage (from repository root):
#   kubectl apply -f k8s_entrega2/26-rf004-create-offer-app.yml
#   minikube service rf004-create-offer-service --url
---
# ============================================================
# rf004-create-offer-app Deployment
# Stateless orchestrator service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf004-create-offer-app
  labels:
    app: rf004-create-offer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rf004-create-offer-app
  template:
    metadata:
      labels:
        app: rf004-create-offer-app
    spec:
      containers:
        - name: rf004-create-offer-app
          image: ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/rf004-create-offer-app:v0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          # Environment-based service URLs for orchestrator calls
          env:
            - name: APP_NAME
              value: "rf004_create_offer_app"
            - name: LOG_LEVEL
              value: "INFO"
            - name: USERS_SERVICE_URL
              value: "http://users-app-service:8000"
            - name: POSTS_SERVICE_URL
              value: "http://posts-app-service:8000"
            - name: ROUTES_SERVICE_URL
              value: "http://routes-app-service:8000"
            - name: OFFERS_SERVICE_URL
              value: "http://offers-app-service:8000"
            - name: SCORES_SERVICE_URL
              value: "http://scores-app-service:8000"

          livenessProbe:
            httpGet:
              path: /rf004/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /rf004/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            limits:
              cpu: "150m"
              memory: "150Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

---
# ============================================================
# rf004-create-offer-app Service (ClusterIP — Ingress-only, no external access)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: rf004-create-offer-service
  labels:
    app: rf004-create-offer-app
spec:
  type: ClusterIP
  selector:
    app: rf004-create-offer-app
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
