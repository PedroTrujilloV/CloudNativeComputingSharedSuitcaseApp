# DB credentials of the shared RDS instance (1_database stack) for the five
# Entrega-2 apps. Rendered by the deploy pipeline (ci_entrega2_deploy.yml)
# with a plain envsubst in the deploy-k8s step.
#
# Channel of each value (the combined tf_outputs JSON must not contain the
# value of any environment secret, or GitHub Actions discards the whole
# output):
#   DB_HOST     -> ${RDS_ADDRESS}: safe output of the 1_database stack.
#   DB_PORT     -> fixed "5432": it is exactly the DB_PORT environment
#                  secret, so it must NOT come through tf_outputs; the value
#                  is the same in every environment, so it is hardcoded.
#   DB_NAME     -> fixed "shared_db": same reason as DB_PORT (it equals the
#                  DB_NAME environment secret).
#   DB_USER     -> ${DB_USERNAME}: the pipeline injects it directly from the
#                  GitHub environment secret into the step environment.
#   DB_PASSWORD -> ${DB_PASSWORD}: same channel as DB_USER.
#
# The same credentials are stored in AWS Secrets Manager
# (grupo33/db-credentials, created by the 1_database stack) for operational
# use and for the local AWS deploy script (deploy-k8s-to-eks.sh).
apiVersion: v1
kind: Secret
metadata:
  name: users-app-secrets
type: Opaque
stringData:
  DB_HOST: "${RDS_ADDRESS}"
  DB_PORT: "5432"
  DB_NAME: "shared_db"
  DB_USER: "${DB_USERNAME}"
  DB_PASSWORD: "${DB_PASSWORD}"
---
