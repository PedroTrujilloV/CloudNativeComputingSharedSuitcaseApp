name: Entrega 2 - Deploy Single Student

# Este pipeline depende de la configuración en el archivo config.yaml
# Se debe configurar las llaves: apps, tf_stacks y k8s_manifests.
on:
  # push:
      #  branches: ['**']   # or just remove the branches filter entirely
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de terraform/environments a desplegar'
        required: true
        default: 'prod'
        type: choice
        options:
          - pe.trujillo
          - dev
          - prod
          - tutor

jobs:
  deploy:
    uses: MISW-4301-Desarrollo-Apps-en-la-Nube/recursos-evaluador/.github/workflows/ci_entrega2_deploy.yml@main
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
