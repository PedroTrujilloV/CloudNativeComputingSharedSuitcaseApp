name: Deploy GitHub Pages

on:
  push:
    branches:
     # - '**'
     # - '**'
      - main   # default main change if your default branch has a different name

  # Allows manually triggering the workflow from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment, skip runs queued between
# in-progress and latest, since we want to deploy the newest commit
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage external READMEs into docs/apps
        run: |
          mkdir -p docs/apps
          cp users_app/README.md  docs/apps/users_app.md
          cp routes_app/README.md docs/apps/routes_app.md
          cp posts_app/README.md  docs/apps/posts_app.md
          cp offers_app/README.md docs/apps/offers_app.md
          cp scores_app/README.md docs/apps/scores_app.md
          cp rf003_create_post_app/README.md docs/apps/rf003_create_post_app.md
          cp rf004_create_offer_app/README.md docs/apps/rf004_create_offer_app.md
          cp rf005_query_post_app/README.md docs/apps/rf005_query_post_app.md
          cp user_verification_callback/README.md docs/apps/user_verification_callback.md

      - name: Stage Terraform stack READMEs into docs
        run: |
          mkdir -p docs/terraform
          for stack in 0_storage 1_database 2_registry eks 4_sns; do
            if [ -f "terraform/stacks/$stack/README.md" ]; then
              cp "terraform/stacks/$stack/README.md" "docs/terraform/${stack}-README.md"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4