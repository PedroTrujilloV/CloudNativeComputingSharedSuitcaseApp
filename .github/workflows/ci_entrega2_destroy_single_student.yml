name: Entrega 2 - Destroy Single Student

# Solo se dispara manualmente: es una acción destructiva e irreversible.
# Destruye stacks en el orden inverso al que declara en el config.yaml.
on:
  # push:
      #  branches: ['**']   # or just remove the branches filter entirely
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de terraform/environments a destruir'
        required: true
        default: 'prod'
        type: choice
        options:
          - pe.trujillo
          - dev
          - prod
          - tutor

jobs:
  destroy:
    uses: MISW-4301-Desarrollo-Apps-en-la-Nube/recursos-evaluador/.github/workflows/ci_entrega2_destroy.yml@main
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
