[tool.poetry]
name = "posts-app"
version = "0.0.1"
description = "Posts Service - Publicaciones/Posts microservice for collaborative logistics platform"
authors = [
    "Juan David Roncancio Camacho <j.roncancioc@uniandes.edu.co>"
    ]
package-mode = false

[tool.poetry.dependencies]
python = "~3.11"
fastapi = "~0.115.12"
uvicorn = "~0.27.1"
sqlalchemy = "~2.0.36"
psycopg = {version = "~3.2.3", extras = ["binary"]}
pydantic = "~2.6.1"
pydantic-settings = "~2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "~8.4.0"
pytest-cov = "~6.1.1"
pytest-env = "~1.1.5"
httpx = "^0.25.0"
black = "^23.0"
flake8 = "^6.0"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
env = [
  "APP_NAME = posts_app",
  "LOG_LEVEL = INFO",
  # Unit tests run against in-memory SQLite; the application default is
  # postgresql, and the startup lifespan would otherwise try to reach a server.
  "DB_DRIVER = sqlite",
  "DB_HOST = localhost",
  "DB_PORT = 5432",
  "DB_NAME = posts_db",
  "DB_USER = posts_user",
  "DB_PASSWORD = posts_password"
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
