[tool.poetry]
name = "routes_app"
version = "0.0.0"
description = "Routes (Trayectos) microservice for the Shared Suitcase delivery platform."
authors = [
  "Pedro Trujillo <pe.trujillo@uniandes.edu.co>"
]
license = "MIT"
readme = "README.md"
package-mode = false
packages = [{include = "*", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "~3.11"
fastapi = "~0.115.12"
uvicorn = "~0.27.1"
python-dotenv = "~1.0.1"
pydantic = "~2.6.1"
pydantic-settings = "~2.1.0"
sqlalchemy = "~2.0.36"
psycopg = {version = "~3.2.3", extras = ["binary"]}

[tool.poetry.group.dev.dependencies]
black = "~25.1.0"
ruff = "~0.11.12"
bandit = "~1.8.3"
flake8 = "~7.2.0"
isort = "~6.0.1"
pytest = "~8.4.0"
pytest-cov = "~6.1.1"
pytest-mock = "~3.14.1"
pytest-env = "~1.1.5"
httpx = "~0.28.1"
faker = "~37.3.0"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["./tests"]
skips = ["B101"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false

[tool.ruff]
src = ["src"]
fix = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = ["--cov=src", "--cov-fail-under=70", "--cov-report=term-missing"]
env = [
  "APP_NAME = routes_app",
  "LOG_LEVEL = INFO",
  "DB_DRIVER = sqlite",
  "DB_HOST = localhost",
  "DB_PORT = 5432",
  "DB_NAME = routes_db",
  "DB_USER = routes_user",
  "DB_PASSWORD = routes_password"
]